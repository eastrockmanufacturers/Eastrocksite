<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Submissions — Admin</title>
    <style>
      body{font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:24px}
      table{width:100%;border-collapse:collapse}
      th,td{padding:8px;border:1px solid #eee;text-align:left}
      .small{font-size:0.9rem;color:#666}
    </style>
  </head>
  <body>
    <h1>Contact form submissions</h1>
    <p class="small">This page loads submissions from <code>/api/submissions</code>. You'll be prompted to enter admin credentials (set ADMIN_USER and ADMIN_PASS in your .env).</p>
    <table id="tbl"><thead><tr><th>ID</th><th>Name</th><th>Company</th><th>Phone</th><th>Product</th><th>Quantity</th><th>Size</th><th>Message</th><th>When</th></tr></thead><tbody></tbody></table>
    <script>
      async function load() {
        try {
          const res = await fetch('/api/submissions?limit=500', { credentials: 'include' });
          if (!res.ok) {
            if (res.status === 401 || res.status === 403) {
              // Trigger browser basic auth prompt by requesting protected resource via XHR is not allowed; instead reload to prompt
              alert('Authentication required. The browser will open a prompt.');
              window.location.href = '/api/submissions';
              return;
            }
            throw new Error('Failed to fetch');
          }
          const json = await res.json();
          const tbody = document.querySelector('#tbl tbody');
          tbody.innerHTML = '';
          json.rows.forEach(r => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${r.id}</td><td>${escape(r.name)}</td><td>${escape(r.company)}</td><td>${escape(r.phone)}</td><td>${escape(r.product_type)}</td><td>${escape(r.quantity)}</td><td>${escape(r.size)}</td><td>${escape(r.message)}</td><td class="small">${r.created_at}</td>`;
            tbody.appendChild(tr);
          });
        } catch (err) {
          console.error(err);
          alert('Error loading submissions. Open /api/submissions directly to authenticate.');
        }
      }
      function escape(s){ if(!s) return ''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
      load();
    </script>
  </body>
</html>
